<title id="eingang-title">Der Eingang der Praxis</title><desc id="eingang-desc">Eine gut erkennbare Eingangstür mit Türblatt, Griff und Rundbogenrahmen. Ein ebener Weg führt zur Tür, daneben steht eine schlichte Pflanze.</desc>
