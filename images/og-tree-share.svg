<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Praxis Läpple – 3D-Baum mit KL</title><desc id="desc">Ein sanft plastischer Baum in Salbei und warmen Naturtönen mit den Initialen KL im Blätterdach.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbf8f2"/><stop offset="1" stop-color="#f2e7dd"/></linearGradient>
 <radialGradient id="crown" cx="32%" cy="22%" r="82%"><stop stop-color="#d9e0d3"/><stop offset=".44" stop-color="#aebca4"/><stop offset=".82" stop-color="#84977d"/><stop offset="1" stop-color="#697e68"/></radialGradient>
 <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a87760"/><stop offset=".46" stop-color="#c99a7f"/><stop offset="1" stop-color="#936d5d"/></linearGradient>
 <filter id="soft-shadow" x="-30%" y="-35%" width="160%" height="190%"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="21"/></filter>
</defs>
